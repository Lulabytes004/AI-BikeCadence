<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Bike Cadence Vision</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0c10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title{font-weight:700;font-size:18px}.status{font-size:12px;padding:6px 9px;border-radius:99px;background:#252932}.view{position:relative;overflow:hidden;border-radius:18px;background:#171a20;aspect-ratio:3/4}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}.hud{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border-radius:16px;padding:13px}.rpm{display:flex;align-items:baseline;gap:8px}.rpm strong{font-size:54px;line-height:1}.rpm span{font-size:17px;color:#cbd0d8}.meta{display:flex;gap:18px;margin-top:7px;font-size:12px;color:#d0d4dc}.bar{height:5px;background:#363b45;border-radius:9px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:width .15s}.controls{display:flex;gap:9px;margin-top:12px}button{flex:1;border:0;border-radius:13px;padding:13px;font-size:16px;font-weight:650}#start{background:#fff;color:#111}#reset{background:#242832;color:#fff}.help{font-size:13px;line-height:1.45;color:#aeb5c1;margin:12px 3px}.err{color:#ffb3b3}.diag{margin-top:10px;padding:10px;border-radius:10px;background:#171a20;font-size:12px;white-space:pre-wrap}.ok{color:#b9f6ca}</style></head><body><div class="app"><div class="top"><div class="title">Bike Cadence Vision</div><div id="status" class="status">Preparado</div></div><div class="view"><video id="video" playsinline muted></video><canvas id="overlay"></canvas><div class="hud"><div class="rpm"><strong id="rpm">--</strong><span>RPM</span></div><div class="meta"><span>Método: <b id="method">--</b></span><span>Confianza: <b id="quality">0%</b></span><span>Ciclos: <b id="cycles">0</b></span></div><div class="bar"><i id="qbar"></i></div></div></div><div class="controls"><button id="start">Iniciar cámara</button><button id="reset">Reset</button></div><div id="help" class="help">Coloca el iPhone de forma que se vea claramente una parte del movimiento de pedaleo. El detector podrá usar rodillas o pies/tobillos y seleccionará automáticamente la señal más estable.<div id="diag" class="diag"></div></div></div>
<script type="module">
let PoseLandmarker, FilesetResolver, DrawingUtils;
async function loadMediaPipe(){
  if(PoseLandmarker) return;
  const mod = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32');
  PoseLandmarker=mod.PoseLandmarker; FilesetResolver=mod.FilesetResolver; DrawingUtils=mod.DrawingUtils;
}
const $=id=>document.getElementById(id), video=$('video'), canvas=$('overlay'), ctx=canvas.getContext('2d');
let pose=null, running=false,lastVideoTime=-1,lastInference=0; let hist=[], peaks=[], smoothRpm=null, cycleCount=0;
const start=$('start'), reset=$('reset'), status=$('status'), diag=$('diag');
function diagnostics(){const secure=window.isSecureContext; const gum=!!navigator.mediaDevices?.getUserMedia; diag.innerHTML=`Origen: ${location.protocol}//${location.host||'(archivo local)'}\nContexto seguro HTTPS: ${secure?'SÍ':'NO'}\nAPI cámara disponible: ${gum?'SÍ':'NO'}\nNavegador: ${navigator.userAgent.includes('Safari')?'Safari/iOS compatible':'WebKit/navegador'}`; return secure&&gum;}
diagnostics();
async function initPose(){ if(pose)return; status.textContent='Cargando IA…'; await loadMediaPipe(); const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm'); pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5}); status.textContent='IA lista'; }
async function camera(){try{
 if(!window.isSecureContext) throw new Error('SECURE_CONTEXT: Safari requiere HTTPS para acceder a la cámara.');
 if(!navigator.mediaDevices?.getUserMedia) throw new Error('CAMERA_API: La API de cámara no está disponible en este contexto.');
 status.textContent='Solicitando cámara…';
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false});
 video.srcObject=stream; await video.play();
 diag.innerHTML='<span class="ok">✓ Cámara autorizada y vídeo iniciado.<br>Ahora cargando IA…</span>';
 status.textContent='Cargando IA…'; await initPose();
 running=true;start.textContent='Detener';status.textContent='Buscando ciclista…';diag.innerHTML='<span class=\"ok\">✓ Cámara autorizada y vídeo iniciado.\n✓ Modelo de pose cargado.</span>';requestAnimationFrame(loop)
}catch(e){console.error(e);status.textContent='Error de cámara';let msg=e.message||String(e);if(e.name==='NotAllowedError')msg='Permiso de cámara denegado. En iPhone: Ajustes → Safari → Cámara, o pulsa aA → Configuración del sitio web → Cámara → Permitir.';else if(e.name==='NotFoundError')msg='No se encontró una cámara disponible.';else if(e.name==='NotReadableError')msg='La cámara está ocupada por otra aplicación o Safari no puede acceder a ella.';diag.innerHTML='<span class=\"err\">✕ '+msg+'</span>';
 }}
function resetData(){hist=[];peaks=[];smoothRpm=null;cycleCount=0;$('rpm').textContent='--';$('cycles').textContent='0';}
function stop(){running=false;video.srcObject?.getTracks().forEach(t=>t.stop());video.srcObject=null;start.textContent='Iniciar cámara';status.textContent='Detenido';ctx.clearRect(0,0,canvas.width,canvas.height)}
start.onclick=()=>running?stop():camera(); reset.onclick=resetData;
function angle(a,b,c){const u={x:a.x-b.x,y:a.y-b.y},v={x:c.x-b.x,y:c.y-b.y};const d=u.x*v.x+u.y*v.y,m=Math.hypot(u.x,u.y)*Math.hypot(v.x,v.y);return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI}
function process(lm,t){const sides=[{n:'Izq.',h:23,k:25,a:27},{n:'Der.',h:24,k:26,a:28}]; let best=null;for(const s of sides){const p=[lm[s.h],lm[s.k],lm[s.a]],q=p.reduce((x,z)=>x+(z.visibility??1),0)/3;if(!best||q>best.q)best={...s,q,p}} if(!best)return; const [h,k,a]=best.p; const ang=angle(h,k,a); const signal=ang; $('side').textContent=best.n;$('quality').textContent=Math.round(best.q*100)+'%';$('qbar').style.width=Math.round(best.q*100)+'%'; if(best.q<.45)return; hist.push({t,v:signal}); while(hist.length&&t-hist[0].t>12000)hist.shift(); if(hist.length<5)return; const n=hist.length, v=hist[n-1].v, v1=hist[n-2].v, v2=hist[n-3].v; // detect flexion minima; one minimum = one revolution for one knee
 if(v1<v2 && v1<v && v1<125){ const pt=hist[n-2].t; const last=peaks.at(-1); if(!last || pt-last>350){ if(last){const dt=pt-last; const inst=60000/dt;if(inst>=25&&inst<=180){smoothRpm=smoothRpm==null?inst:.72*smoothRpm+.28*inst;cycleCount++;$('rpm').textContent=Math.round(smoothRpm);$('cycles').textContent=cycleCount}} peaks.push(pt);while(peaks.length&&pt-peaks[0]>10000)peaks.shift();}}
 status.textContent=smoothRpm?'Midiendo':'Detectando pedaleo…'; return {best,ang};}
function draw(lm,best){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.clearRect(0,0,canvas.width,canvas.height);if(!lm)return; const d=new DrawingUtils(ctx);d.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color:'rgba(255,255,255,.45)',lineWidth:3}); if(best){for(const p of best.p){ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,9,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#111';ctx.stroke()}}}
function loop(ts){if(!running)return;if(video.readyState>=2&&video.currentTime!==lastVideoTime&&ts-lastInference>45){lastVideoTime=video.currentTime;lastInference=ts;pose.detectForVideo(video,performance.now(),res=>{const lm=res.landmarks?.[0];if(lm){const out=process(lm,performance.now());draw(lm,out?.best)}else{status.textContent='No veo una persona';draw(null)}})}requestAnimationFrame(loop)}
</script></body></html>
