<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AI Bike Cadence</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#0a0c10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center}
    .app{width:min(720px,100%);padding:24px}
    h1{margin:0 0 8px;font-size:32px}
    p{margin:0 0 24px;color:#aeb5c1;line-height:1.45}
    .grid{display:grid;gap:14px}
    a{display:block;text-decoration:none;color:inherit;background:#171a20;border:1px solid #2a2f39;border-radius:18px;padding:20px}
    a:active{transform:scale(.99)}
    .tag{display:inline-block;font-size:12px;background:#252932;border-radius:99px;padding:5px 8px;margin-bottom:10px;color:#cbd0d8}
    .title{font-size:20px;font-weight:750;margin-bottom:6px}
    .desc{font-size:14px;color:#aeb5c1;line-height:1.4}
  </style>
</head>
<body>
  <main class="app">
    <h1>AI Bike Cadence</h1>
    <p>Selecciona el módulo que quieres abrir.</p>
    <div class="grid">
      <a href="./measure.html">
        <span class="tag">Medición</span>
        <div class="title">Cadence Vision</div>
        <div class="desc">Mide RPM y ciclos con la cámara o un vídeo local. Incluye pausa, avance por fotogramas y diagnóstico para dos ciclistas.</div>
      </a>
      <a href="./game.html">
        <span class="tag">Juego</span>
        <div class="title">Platform Challenge</div>
        <div class="desc">Nueva webapp para el modo de plataformas y progresión por niveles.</div>
      </a>
    </div>
  </main>
</body>
</html>
